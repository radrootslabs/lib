[package]
name = "radroots_sync"
description = "Synchronization orchestration for Radroots"
version = "0.1.0-alpha"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
publish = false

[lib]
name = "radroots_sync"

[features]
default = ["serde"]
serde = [
  "dep:serde",
  "radroots_event/serde",
  "radroots_event_codec/serde",
  "radroots_protocol/serde",
  "radroots_signing/serde",
  "radroots_storage/serde",
  "radroots_trade/serde",
  "radroots_transport/serde",
]

[dependencies]
radroots_event = { workspace = true, default-features = false }
radroots_event_codec = { workspace = true, default-features = false }
radroots_protocol = { workspace = true, default-features = false }
radroots_signing = { workspace = true, default-features = false }
radroots_storage = { workspace = true, default-features = false }
radroots_trade = { workspace = true, default-features = false }
radroots_transport = { workspace = true, default-features = false }
serde = { workspace = true, optional = true }
sha2 = { workspace = true, default-features = false }

[dev-dependencies]
futures = { workspace = true }
futures-executor = { workspace = true }
radroots_storage = { workspace = true, features = ["memory"] }
radroots_storage_sqlite = { workspace = true }
secp256k1 = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
