[package]
name = "radroots_sdk"
publish = ["crates-io"]
version.workspace = true
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Host-neutral asynchronous client engine for Radroots"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/radroots_sdk"
keywords = ["radroots", "sdk", "local-food", "nostr"]
categories = ["api-bindings", "asynchronous", "network-programming"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]
autotests = false
autoexamples = false

[package.metadata.docs.rs]
features = ["memory", "sync", "nostr", "nip46", "local-signing", "geonames", "knowledge"]

[lib]
name = "radroots_sdk"

[features]
default = ["memory"]
memory = ["radroots_storage/memory"]
sqlite = ["dep:radroots_storage_sqlite"]
sync = ["dep:radroots_sync", "dep:uuid"]
nostr = [
  "sync",
  "dep:radroots_nostr",
  "dep:radroots_transport_nostr",
]
nip46 = [
  "nostr",
  "dep:radroots_nostr_connect",
]
local-signing = [
  "dep:radroots_nostr",
  "dep:radroots_secrets",
  "radroots_nostr/signing",
]
radrootsd = [
  "sync",
  "dep:reqwest",
  "dep:serde",
  "dep:serde_json",
]
geonames = ["dep:radroots_geonames"]
knowledge = [
  "radroots_event/knowledge",
  "radroots_event_codec/knowledge",
]
native = ["sqlite", "sync", "local-signing"]
full = [
  "native",
  "nostr",
  "nip46",
  "radrootsd",
  "geonames",
  "knowledge",
]

[dependencies]
radroots_core = { workspace = true, default-features = false }
radroots_event = { workspace = true, default-features = false }
radroots_event_codec = { workspace = true, default-features = false, features = [
  "json",
  "std",
] }
radroots_identity = { workspace = true, default-features = false }
radroots_protocol = { workspace = true, default-features = false }
radroots_signing = { workspace = true, default-features = false }
radroots_storage = { workspace = true, default-features = false }
radroots_trade = { workspace = true, default-features = false }
radroots_transport = { workspace = true, default-features = false }

radroots_geonames = { workspace = true, optional = true, default-features = false }
radroots_nostr = { workspace = true, optional = true, default-features = false }
radroots_nostr_connect = { workspace = true, optional = true, default-features = false }
radroots_secrets = { workspace = true, optional = true, default-features = false }
radroots_storage_sqlite = { workspace = true, optional = true, default-features = false }
radroots_sync = { workspace = true, optional = true, default-features = false }
radroots_transport_nostr = { workspace = true, optional = true, default-features = false }

reqwest = { workspace = true, optional = true, default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { workspace = true, optional = true, features = ["derive"] }
serde_json = { workspace = true, optional = true, features = ["std"] }
uuid = { workspace = true, optional = true, features = ["v4"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "package_boundary"
path = "tests/package_boundary.rs"

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"

[[test]]
name = "public_api"
path = "tests/public_api.rs"

[[example]]
name = "safe_memory_client"
path = "examples/safe_memory_client.rs"
required-features = ["memory"]

[[example]]
name = "transport_profile"
path = "examples/transport_profile.rs"

[lints]
workspace = true
