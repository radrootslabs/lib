[package]
name = "radroots_storage_sqlite"
description = "SQLite storage backend for Radroots"
version = "0.1.0-alpha"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
publish = ["crates-io"]
documentation = "https://docs.rs/radroots_storage_sqlite"
keywords = ["radroots", "sqlite", "storage", "database"]
categories = ["database"]
include = [
  "src/**",
  "tests/**",
  "!tests/package_boundary.rs",
  "Cargo.toml",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[package.metadata.docs.rs]
features = []

[lib]
name = "radroots_storage_sqlite"

[dependencies]
nostr = { workspace = true, default-features = false, features = ["std", "nip44"] }
fs2 = { workspace = true }
getrandom = { workspace = true }
radroots_domain = { workspace = true, features = ["std", "serde"] }
radroots_event = { workspace = true, default-features = false, features = [
  "serde",
  "std",
] }
radroots_event_codec = { workspace = true, default-features = false, features = [
  "json",
  "std",
] }
radroots_nostr = { workspace = true, default-features = false, features = ["commerce", "public_ingress"] }
radroots_protocol = { workspace = true, default-features = false, features = ["commerce"] }
radroots_secrets = { workspace = true, default-features = false }
radroots_storage = { workspace = true, default-features = false, features = [
  "serde",
  "command_journal",
  "protected_outbox",
] }
radroots_transport = { workspace = true, default-features = false, features = [
  "serde",
  "std",
] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std", "raw_value"] }
sha2 = { workspace = true, features = ["std"] }
rustix = { workspace = true }
subtle = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
zeroize = { workspace = true, features = ["alloc"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite-bundled"] }

[dev-dependencies]
radroots_signing = { workspace = true, features = ["chat", "artifacts"] }
radroots_nostr = { workspace = true, default-features = false, features = ["nip17"] }
radroots_protocol = { workspace = true, default-features = false, features = ["chat"] }
nostr = { workspace = true, default-features = false, features = ["std", "nip44"] }
futures = { workspace = true }
hex = { workspace = true }
radroots_secrets = { workspace = true, features = ["file", "memory"] }
radroots_storage = { workspace = true, default-features = false, features = ["memory", "serde"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
toml = { workspace = true }

[lints]
workspace = true
