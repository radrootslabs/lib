[package]
name = "radroots_storage_sqlite"
description = "SQLite storage backend for Radroots"
version = "0.1.0-alpha"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
publish = ["crates-io"]
documentation = "https://docs.rs/radroots_storage_sqlite"
keywords = ["radroots", "sqlite", "storage", "database"]
categories = ["database"]
include = ["src/**", "tests/**", "!tests/package_boundary.rs", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
features = []

[lib]
name = "radroots_storage_sqlite"

[dependencies]
fs2 = { workspace = true }
radroots_event_codec = { workspace = true, default-features = false, features = ["json", "std"] }
radroots_secrets = { workspace = true, default-features = false }
radroots_storage = { workspace = true, default-features = false }
sha2 = { workspace = true, features = ["std"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite-bundled"] }

[dev-dependencies]
radroots_event = { workspace = true, default-features = false, features = ["std"] }
radroots_transport = { workspace = true, default-features = false }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
toml = { workspace = true }

[lints]
workspace = true
