[package]
name = "radroots-trade"
publish = false
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Trade domain model for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots-trade"
readme = "README.md"

[lib]
name = "radroots_trade"

[features]
default = ["std", "serde", "serde_json"]
dto-bindgen = [
  "std",
  "serde_json",
  "dep:dto_bindgen",
  "dep:dto_bindgen_core",
  "radroots_core/dto-bindgen",
  "radroots_event/dto-bindgen",
]
std = [
  "radroots_authority/std",
  "radroots_core/std",
  "radroots_event/std",
  "radroots_event_codec/std",
  "radroots_event_codec/nostr",
]
event_store = [
  "std",
  "serde_json",
  "dep:radroots_event_store",
  "dep:sqlx",
  "radroots_event_store/sqlite",
  "radroots_event_store/runtime-tokio",
  "sqlx/sqlite-bundled",
]
serde = [
  "dep:serde",
  "radroots_core/serde",
  "radroots_event/serde",
  "radroots_event_codec/serde",
]
serde_json = [
  "serde",
  "dep:base64",
  "dep:hex",
  "dep:serde_json",
  "dep:sha2",
  "radroots_event_codec/serde_json",
]

[dependencies]
radroots_authority = { workspace = true, default-features = false }
radroots_core = { workspace = true, default-features = false }
radroots_event = { workspace = true, default-features = false }
radroots_event_codec = { workspace = true, default-features = false }
radroots_event_store = { workspace = true, optional = true, default-features = false }
base64 = { workspace = true, optional = true }
dto_bindgen = { workspace = true, optional = true }
dto_bindgen_core = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
], optional = true }
sha2 = { workspace = true, default-features = false, optional = true }
sqlx = { workspace = true, default-features = false, features = [
  "derive",
], optional = true }
thiserror = { workspace = true }

[dev-dependencies]
nostr = { workspace = true }
radroots_test_fixtures = { workspace = true }
radroots_nostr = { workspace = true, default-features = false, features = [
  "std",
  "events",
] }
radroots_transport = { workspace = true, default-features = false }
sqlx = { workspace = true, default-features = false, features = [
  "runtime-tokio",
  "sqlite-bundled",
] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
