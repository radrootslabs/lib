[package]
name = "radroots_trade"
publish = ["crates-io"]
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic trade validation, reduction, evidence, and workflow planning for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_trade"
readme = "README.md"
keywords = ["radroots", "trade", "local-food", "workflow"]
categories = ["algorithms", "data-structures", "no-std"]
include = [
  "src/**",
  "tests/**",
  "!tests/package_boundary.rs",
  "examples/**",
  "Cargo.toml",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[package.metadata.docs.rs]
features = ["std", "serde", "json"]

[lib]
name = "radroots_trade"

[features]
default = ["std", "serde", "json"]
std = ["radroots_core/std", "radroots_event/std", "radroots_identity/std"]
serde = [
  "dep:serde",
  "radroots_core/serde",
  "radroots_event/serde",
  "radroots_identity/serde",
]
json = ["serde", "dep:hex", "dep:serde_json", "dep:sha2"]

[dependencies]
radroots_core = { workspace = true, default-features = false }
radroots_event = { workspace = true, default-features = false }
radroots_identity = { workspace = true, default-features = false }
hex = { workspace = true, optional = true }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
], optional = true }
sha2 = { workspace = true, default-features = false, optional = true }

[lints]
workspace = true
