[package]
name = "radroots_trade"
publish = false
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deterministic trade validation, reduction, evidence, and workflow planning for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_trade"
readme = "README.md"

[lib]
name = "radroots_trade"

[features]
default = ["std", "serde", "serde_json"]
dto-bindgen = [
  "std",
  "serde_json",
  "dep:dto_bindgen",
  "dep:dto_bindgen_core",
]
std = [
  "radroots_core/std",
  "radroots_event/std",
  "radroots_event_codec/std",
  "radroots_identity/std",
]
serde = [
  "dep:serde",
  "radroots_core/serde",
  "radroots_event/serde",
  "radroots_event_codec/serde",
  "radroots_identity/serde",
]
serde_json = [
  "serde",
  "dep:base64",
  "dep:hex",
  "dep:serde_json",
  "dep:sha2",
  "radroots_event_codec/json",
]

[dependencies]
radroots_core = { workspace = true, default-features = false }
radroots_event = { workspace = true, default-features = false }
radroots_event_codec = { workspace = true, default-features = false }
radroots_identity = { workspace = true, default-features = false }
base64 = { workspace = true, optional = true }
dto_bindgen = { workspace = true, optional = true }
dto_bindgen_core = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
], optional = true }
sha2 = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
nostr = { workspace = true }
radroots_test_fixtures = { workspace = true }

[lints]
workspace = true
