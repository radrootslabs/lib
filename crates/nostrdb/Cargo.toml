[package]
name = "radroots_nostrdb"
publish = false
version = "1.0.0-alpha.1"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "NostrDB integration layer for Radroots"
repository.workspace = true
homepage.workspace = true
readme = "README"

[features]
default = ["std", "rt", "nostrdb", "runtime-adapter"]
std = []
rt = ["std", "dep:futures", "dep:tokio"]
nostrdb = ["std", "dep:nostrdb"]
runtime-adapter = ["std", "dep:radroots_nostr_runtime"]
giftwrap = ["std", "nostrdb"]

[dependencies]
radroots_nostr = { workspace = true, default-features = false, features = [
  "std",
] }
radroots_nostr_runtime = { workspace = true, optional = true, default-features = false, features = [
  "std",
  "rt",
  "nostr-client",
] }
futures = { workspace = true, optional = true }
hex = { workspace = true }
nostrdb = { version = "0.9.0", optional = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
nostr = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tempfile = { workspace = true }
