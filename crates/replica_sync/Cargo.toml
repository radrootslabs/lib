[package]
name = "radroots_replica_sync"
publish = false
version = "1.0.0-alpha.1"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Replica synchronization layer for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_replica_sync"
readme = "README"

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = [
  "radroots_event/std",
  "radroots_event_codec/std",
  "radroots_sql_core/std",
]
legacy-ingest = ["std", "radroots_event_codec/nostr", "dep:base64", "dep:uuid"]

[[test]]
name = "ingest_roundtrip"
path = "tests/ingest_roundtrip.rs"
required-features = ["legacy-ingest"]

[dependencies]
radroots_event = { workspace = true, default-features = false, features = [
  "serde",
] }
radroots_core = { workspace = true, default-features = false }
radroots_event_codec = { workspace = true, default-features = false, features = [
  "serde_json",
] }
radroots_sql_core = { workspace = true }
radroots_replica_schema = { workspace = true }
radroots_replica_store = { workspace = true }
hex = { workspace = true }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
] }
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
] }
sha2 = { workspace = true, default-features = false }
base64 = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
nostr = { workspace = true }
radroots_nostr = { workspace = true, default-features = false, features = [
  "events",
  "std",
] }
radroots_test_fixtures = { workspace = true }
radroots_sql_core = { workspace = true, features = ["native"] }
radroots_replica_store = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
