[package]
name = "radroots_nostr"
publish = ["crates-io"]
version = "0.1.0-alpha.2"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Nostr integration layer for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_nostr"
readme = "README"

[features]
default = ["std"]
std = []
client = ["std", "dep:nostr-sdk", "dep:radroots_identity"]
codec = [
  "dep:radroots_event",
  "dep:radroots_event_codec",
  "radroots_event_codec/nostr",
]
events = [
  "dep:radroots_event",
  "dep:radroots_event_codec",
  "radroots_event/std",
  "radroots_event/serde",
  "radroots_event_codec/std",
]
http = ["dep:reqwest"]
nip17 = ["std", "codec", "nostr/nip44", "nostr/nip59"]

[dependencies]
radroots_event = { workspace = true, optional = true, default-features = false }
radroots_event_codec = { workspace = true, optional = true, default-features = false }
radroots_identity = { workspace = true, optional = true, default-features = false, features = [
  "std",
] }
nostr = { workspace = true, features = ["nip04"] }
nostr-sdk = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
