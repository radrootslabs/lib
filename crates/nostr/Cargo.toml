[package]
name = "radroots_nostr"
publish = ["crates-io"]
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nostr integration layer for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_nostr"
readme = "README.md"
keywords = ["radroots", "nostr", "events", "signing"]
categories = ["network-programming", "cryptography"]
include = [
  "src/**",
  "tests/**",
  "!tests/generic_builder_boundary.rs",
  "!tests/package_boundary.rs",
  "examples/**",
  "Cargo.toml",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[package.metadata.docs.rs]
features = ["std", "events", "blossom", "nip17", "signing", "commerce", "public_ingress"]

[lib]
name = "radroots_nostr"

[lints]
workspace = true

[features]
default = ["std", "events"]
std = [
  "nostr/std",
  "radroots_event/std",
  "radroots_event_codec/std",
  "radroots_identity/std",
]
blossom = ["events", "dep:base64", "dep:radroots_blossom"]
events = [
  "std",
  "nostr/nip04",
  "radroots_event/serde",
  "radroots_event_codec/json",
]
nip17 = ["events", "nostr/nip44", "nostr/nip59", "dep:base64", "radroots_protocol/chat"]
private_ingress = ["signing", "nostr/nip44", "dep:base64", "radroots_protocol/private_rumor"]
commerce = ["private_ingress", "radroots_protocol/commerce", "radroots_signing/commerce"]
public_ingress = ["events", "radroots_protocol/listing", "radroots_protocol/advertisement"]
signing = [
  "dep:radroots_protocol",
  "events",
  "dep:radroots_signing",
  "nostr/nip49",
  "radroots_signing/std",
]

[dependencies]
base64 = { workspace = true, optional = true }
radroots_blossom = { workspace = true, optional = true, default-features = false }
radroots_event = { workspace = true, default-features = false }
radroots_event_codec = { workspace = true, default-features = false }
radroots_identity = { workspace = true, default-features = false }
radroots_signing = { workspace = true, optional = true, default-features = false }
radroots_protocol = { workspace = true, optional = true, default-features = false, features = ["nip01"] }
nostr = { workspace = true, default-features = false, features = ["alloc"] }
zeroize = { workspace = true, default-features = false, features = ["alloc"] }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
] }
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
  "raw_value",
] }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
radroots_blossom = { workspace = true, default-features = false, features = [
  "std",
] }
radroots_protocol = { workspace = true, default-features = false, features = [
  "std",
] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "post_profile"
required-features = ["events"]

[[test]]
name = "profile_event_builder"
required-features = ["events"]

[[test]]
name = "food_availability_profile"
required-features = ["events"]

[[test]]
name = "nip10_reply_profile"
required-features = ["events"]

[[test]]
name = "nip09_deletion_request_profile"
required-features = ["events"]

[[test]]
name = "nip22_comment_profile"
required-features = ["events"]

[[test]]
name = "authored_wire_corpus"
required-features = ["events"]

[[test]]
name = "blossom_conformance"
required-features = ["blossom"]

[[test]]
name = "nip17_conformance"
required-features = ["nip17"]

[[test]]
name = "commerce_envelopes"
required-features = ["commerce"]

[[test]]
name = "public_heads"
required-features = ["public_ingress"]

[[example]]
name = "participant_private"
required-features = ["signing", "nip17"]
