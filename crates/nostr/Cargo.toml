[package]
name = "radroots_nostr"
publish = false
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nostr integration layer for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_nostr"
readme = "README.md"

[lib]
name = "radroots_nostr"

[lints]
workspace = true

[features]
default = ["std", "events"]
std = [
  "nostr/std",
  "radroots_event/std",
  "radroots_event_codec/std",
  "radroots_identity/std",
]
blossom = ["std", "dep:base64", "dep:radroots_blossom"]
client = ["std", "dep:nostr-sdk"]
codec = []
events = [
  "std",
  "radroots_event/serde",
  "radroots_event_codec/json",
]
http = ["dep:reqwest"]
nip17 = ["std", "codec", "nostr/nip44", "nostr/nip59"]
signing = ["events", "dep:radroots_signing", "radroots_signing/std"]

[dependencies]
base64 = { workspace = true, optional = true }
radroots_blossom = { workspace = true, optional = true, default-features = false }
radroots_event = { workspace = true, default-features = false }
radroots_event_codec = { workspace = true, default-features = false }
radroots_identity = { workspace = true, default-features = false }
radroots_signing = { workspace = true, optional = true, default-features = false }
nostr = { workspace = true, default-features = false, features = [
  "alloc",
  "nip04",
] }
nostr-sdk = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
radroots_blossom = { workspace = true, default-features = false, features = [
  "std",
] }
radroots_protocol = { workspace = true, default-features = false, features = [
  "std",
] }
radroots_test_fixtures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[test]]
name = "post_profile"
required-features = ["events"]

[[test]]
name = "profile_event_builder"
required-features = ["events"]

[[test]]
name = "food_availability_profile"
required-features = ["events"]

[[test]]
name = "nip10_reply_profile"
required-features = ["codec", "events"]

[[test]]
name = "nip09_deletion_request_profile"
required-features = ["codec", "events"]

[[test]]
name = "nip22_comment_profile"
required-features = ["codec", "events"]
