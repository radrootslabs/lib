[package]
name = "radroots_transport_nostr"
publish = false
version = "1.0.0-alpha.1"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Nostr transport layer for Radroots"
repository.workspace = true
homepage.workspace = true
readme = "README"

[features]
default = ["std", "client", "storage", "runtime-tokio"]
std = []
client = [
  "dep:radroots_nostr",
  "radroots_nostr/std",
  "radroots_nostr/client",
  "radroots_nostr/events",
]
storage = [
  "dep:radroots_event_store",
  "dep:radroots_outbox",
  "radroots_outbox/event-store-adapter",
  "client",
]
runtime-tokio = [
  "dep:tokio",
  "storage",
  "radroots_event_store/runtime-tokio",
  "radroots_outbox/runtime-tokio",
]

[dependencies]
radroots_event = { workspace = true, default-features = false, features = [
  "serde",
  "signature",
  "std",
] }
radroots_event_store = { workspace = true, optional = true, default-features = false, features = [
  "sqlite",
  "runtime-tokio",
] }
radroots_nostr = { workspace = true, optional = true, default-features = false, features = [
  "std",
  "client",
  "events",
] }
radroots_outbox = { workspace = true, optional = true, default-features = false, features = [
  "sqlite",
  "runtime-tokio",
] }
radroots_transport = { workspace = true, default-features = false }
futures = { workspace = true }
hex = { workspace = true }
nostr = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["rt"] }
url = { workspace = true }

[dev-dependencies]
radroots_authority = { workspace = true, features = ["local_signer"] }
radroots_blossom = { workspace = true, features = ["serde", "std"] }
radroots_event_codec = { workspace = true, features = ["serde_json"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
