[package]
name = "radroots_transport_nostr"
publish = ["crates-io"]
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nostr transport layer for Radroots"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/radroots_transport_nostr"
keywords = ["radroots", "nostr", "transport", "websocket"]
categories = ["asynchronous", "network-programming"]
include = [
  "src/**",
  "tests/**",
  "!tests/legacy_quarantine.rs",
  "!tests/network_hardening.rs",
  "!tests/package_boundary.rs",
  "!tests/workspace_consumers.rs",
  "examples/**",
  "Cargo.toml",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[package.metadata.docs.rs]
features = []

[lib]
name = "radroots_transport_nostr"

[dependencies]
radroots_event_codec = { workspace = true, default-features = false, features = [
  "json",
] }
radroots_nostr = { workspace = true, default-features = false, features = [
  "events",
] }
radroots_protocol = { workspace = true, default-features = false }
radroots_transport = { workspace = true, default-features = false, features = ["std"] }
async-wsocket = { workspace = true }
futures = { workspace = true }
nostr-sdk = { workspace = true }
serde_json = { workspace = true, features = ["std", "raw_value"] }
sha2 = { workspace = true, default-features = false }
tokio = { workspace = true, features = ["sync"] }
url = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-utility = { workspace = true }
getrandom_04 = { workspace = true, features = ["wasm_js"] }
wasm-bindgen-futures = { workspace = true }
web-time = { workspace = true }

[dev-dependencies]
radroots_nostr = { workspace = true, default-features = false, features = ["commerce"] }
radroots_signing = { workspace = true, default-features = false, features = ["std"] }
tokio-tungstenite = { workspace = true }
tokio = { workspace = true, features = [
  "macros",
  "net",
  "rt-multi-thread",
  "test-util",
  "time",
] }

[lints]
workspace = true
