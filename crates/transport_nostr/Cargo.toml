[package]
name = "radroots_transport_nostr"
publish = ["crates-io"]
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nostr transport layer for Radroots"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/radroots_transport_nostr"
keywords = ["radroots", "nostr", "transport", "websocket"]
categories = ["asynchronous", "network-programming"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
features = []

[lib]
name = "radroots_transport_nostr"

[dependencies]
radroots_event_codec = { workspace = true, default-features = false, features = ["json"] }
radroots_nostr = { workspace = true, default-features = false, features = ["events"] }
radroots_protocol = { workspace = true, default-features = false }
radroots_transport = { workspace = true, default-features = false }
async-wsocket = { workspace = true }
nostr-sdk = { workspace = true }
nostr-relay-pool = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["net", "time"] }
tokio-tungstenite = { workspace = true }
url = { workspace = true }

[dev-dependencies]
futures = { workspace = true }

[lints]
workspace = true
