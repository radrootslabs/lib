[package]
name = "radroots_mesh_agent_client"
publish = false
version = "0.1.0-alpha.2"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Mesh agent client boundary for Radroots"
repository.workspace = true
homepage.workspace = true
readme = "README"

[features]
default = ["serde"]
serde = ["dep:serde", "radroots_mesh/serde"]

[dependencies]
radroots_mesh = { workspace = true, default-features = false }
radroots_mesh_agent_proto = { workspace = true, default-features = false }
radroots_transport = { workspace = true, default-features = false }
serde = { workspace = true, optional = true, features = ["derive", "std"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
