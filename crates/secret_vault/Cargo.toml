[package]
name = "radroots_secret_vault"
publish = false
version = "0.1.0-alpha"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Secret storage model for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_secret_vault"
readme = "README"

[package.metadata.radroots.compatibility]
status = "publish_frozen"
replacement = "radroots_secrets"
deviation = "RCRV1-DEV-008"
removal_step = 313
new_consumers_forbidden = true

[features]
default = []
std = []
memory-vault = ["std"]
os-keyring = ["std", "dep:keyring"]

[dependencies]
keyring = { workspace = true, optional = true }
