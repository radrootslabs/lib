[package]
name = "radroots_protected_store"
publish = false
version = "0.1.0-alpha"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Protected storage model for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_protected_store"
readme = "README"

[package.metadata.radroots.compatibility]
status = "publish_frozen"
replacement = "radroots_secrets"
deviation = "RCRV1-DEV-008"
removal_step = 313
new_consumers_forbidden = true

[features]
default = []
std = ["radroots_secret_vault/std"]

[dependencies]
chacha20poly1305 = { workspace = true }
getrandom = { workspace = true }
radroots_secret_vault = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
