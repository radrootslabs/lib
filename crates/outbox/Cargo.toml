[package]
name = "radroots_outbox"
publish = false
version = "1.0.0-alpha.1"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Publish queue model for Radroots"
repository.workspace = true
homepage.workspace = true
readme = "README"

[features]
default = ["event-store-adapter"]
sqlite = [
  "dep:getrandom",
  "dep:radroots_event_codec",
  "dep:sqlx",
  "dep:url",
  "radroots_event/signature",
  "sqlx/sqlite-bundled",
]
runtime-tokio = ["sqlite", "sqlx/runtime-tokio", "dep:tokio"]
event-store-adapter = [
  "runtime-tokio",
  "dep:radroots_event_store",
  "radroots_event_store/sqlite",
  "radroots_event_store/runtime-tokio",
]

[dependencies]
radroots_event = { workspace = true, default-features = false, features = [
  "std",
  "serde",
] }
radroots_event_store = { workspace = true, default-features = false, optional = true }
radroots_event_codec = { workspace = true, default-features = false, features = [
  "serde_json",
  "std",
], optional = true }
radroots_transport = { workspace = true, default-features = false }
getrandom = { workspace = true, optional = true, features = ["std"] }
hex = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true }
sqlx = { workspace = true, optional = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, optional = true, features = ["time"] }
url = { workspace = true, optional = true }

[dev-dependencies]
radroots_nostr = { workspace = true, default-features = false, features = [
  "std",
  "events",
] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
