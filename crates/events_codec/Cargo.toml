[package]
name = "radroots_events_codec"
publish = ["crates-io"]
version = "0.1.0-alpha.2"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Event codec layer for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_events_codec"
readme = "README"

[features]
default = ["std"]
std = ["radroots_core/std", "radroots_events/std"]
serde = ["dep:serde", "radroots_core/serde", "radroots_events/serde"]
serde_json = ["serde", "dep:serde_json"]
nostr = ["dep:nostr", "std"]
knowledge = ["serde_json", "radroots_events/knowledge"]
knowledge-nip54 = ["knowledge", "radroots_events/knowledge-nip54"]
contract-manifest = ["knowledge", "dep:hex", "dep:sha2"]

[dependencies]
radroots_core = { workspace = true, default-features = false }
radroots_events = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = [
  "alloc",
], optional = true }
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
], optional = true }
nostr = { workspace = true, optional = true }
hex = { version = "0.4", default-features = false, features = [
  "alloc",
], optional = true }
sha2 = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
radroots_test_fixtures = { workspace = true }
