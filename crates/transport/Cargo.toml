[package]
name = "radroots_transport"
publish = ["crates-io"]
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Transport-neutral delivery model for Radroots"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/radroots_transport"
keywords = ["radroots", "transport", "async", "networking"]
categories = ["asynchronous", "network-programming", "no-std"]
include = ["src/**", "tests/**", "!tests/package_boundary.rs", "!tests/source_boundary.rs", "examples/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
features = ["std", "serde"]

[lib]
name = "radroots_transport"

[features]
default = ["std", "serde"]
std = [
  "radroots_event/std",
  "radroots_identity/std",
  "radroots_protocol/std",
]
serde = [
  "dep:serde",
  "radroots_event/serde",
  "radroots_identity/serde",
  "radroots_protocol/serde",
]

[dependencies]
radroots_event = { workspace = true, default-features = false }
radroots_identity = { workspace = true, default-features = false }
radroots_protocol = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
sha2 = { workspace = true, default-features = false }

[dev-dependencies]
futures = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
