[package]
name = "radroots_event_codec"
publish = ["crates-io"]
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Event codec layer for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_event_codec"
readme = "README.md"
keywords = ["radroots", "nostr", "codec", "events"]
categories = ["encoding", "no-std"]
include = ["src/**", "tests/**", "!tests/package_boundary.rs", "examples/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
features = ["std", "json", "knowledge", "manifests"]

[lib]
name = "radroots_event_codec"

[features]
default = ["std", "json"]
std = [
  "radroots_blossom/std",
  "radroots_core/std",
  "radroots_event/std",
  "radroots_identity/std",
  "radroots_protocol/std",
]
serde = [
  "dep:serde",
  "radroots_core/serde",
  "radroots_event/serde",
  "radroots_identity/serde",
  "radroots_protocol/serde",
]
json = ["serde", "dep:serde_json"]
knowledge = ["json", "radroots_event/knowledge"]
manifests = ["knowledge"]

[dependencies]
radroots_blossom = { workspace = true, default-features = false }
radroots_core = { workspace = true, default-features = false }
radroots_event = { workspace = true, default-features = false }
radroots_identity = { workspace = true, default-features = false }
radroots_protocol = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = [
  "alloc",
], optional = true }
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
], optional = true }
secp256k1 = { workspace = true }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
sha2 = { workspace = true, default-features = false }

[dev-dependencies]
nostr = { workspace = true, features = ["std"] }
radroots_blossom = { workspace = true, default-features = false, features = [
  "serde",
  "std",
] }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
