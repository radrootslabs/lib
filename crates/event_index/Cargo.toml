[package]
name = "radroots_event_index"
publish = false
version = "0.1.0-alpha"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Publish-frozen compatibility models superseded by radroots_storage"
repository.workspace = true
homepage.workspace = true
readme = "README"

[package.metadata.radroots.compatibility]
status = "publish_frozen"
replacement = "radroots_storage"
deviation = "RCRV1-DEV-009"
removal_step = 313
new_consumers_forbidden = true

[features]
default = ["serde"]
dto-bindgen = ["std", "serde", "dep:dto_bindgen", "dep:dto_bindgen_core"]
serde = ["dep:serde"]
std = []

[dependencies]
dto_bindgen = { workspace = true, optional = true }
dto_bindgen_core = { workspace = true, optional = true }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
