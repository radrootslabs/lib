[package]
name = "radroots_secrets"
description = "Secret material and protected-storage abstractions for Radroots"
version = "0.1.0-alpha"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/radroots_secrets"
publish = ["crates-io"]
keywords = ["radroots", "secrets", "encryption", "keyring"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
features = ["std", "serde", "memory", "file"]

[lib]
name = "radroots_secrets"

[features]
default = ["std", "serde"]
std = []
serde = ["dep:serde"]
memory = ["std"]
file = ["std", "dep:tempfile"]
keyring = ["std", "dep:keyring"]

[dependencies]
chacha20poly1305 = { workspace = true }
keyring = { workspace = true, optional = true }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
tempfile = { workspace = true, optional = true }
zeroize = { workspace = true }

[dev-dependencies]
futures-executor = { workspace = true }
hex = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[[example]]
name = "explicit_memory_provider"
path = "examples/explicit_memory_provider.rs"
required-features = ["memory"]

[lints]
workspace = true
