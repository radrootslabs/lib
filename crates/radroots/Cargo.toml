[package]
name = "radroots"
description = "Curated ordinary-user Rust facade for Radroots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
publish = false

[lints]
workspace = true

[lib]
name = "radroots"
path = "src/lib.rs"

[dependencies]
radroots_core = { workspace = true }
radroots_event = { workspace = true }
radroots_identity = { workspace = true }
radroots_sdk = { workspace = true }
radroots_trade = { workspace = true }
radroots_transport = { workspace = true }

[features]
default = ["client"]
client = ["radroots_sdk/memory"]
native = ["client"]
nostr = ["client"]
nip46 = ["nostr"]
radrootsd = ["client"]
geonames = ["client"]
knowledge = ["client"]
full = ["native", "nostr", "nip46", "radrootsd", "geonames", "knowledge"]
