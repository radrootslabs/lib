[package]
name = "radroots_protocol"
publish = ["crates-io"]
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Versioned wire contracts for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_protocol"
readme = "README.md"
keywords = ["radroots", "protocol", "local-food", "wire-format"]
categories = ["encoding", "no-std"]
include = [
  "src/**",
  "tests/**",
  "!tests/package_boundary.rs",
  "examples/**",
  "Cargo.toml",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[package.metadata.docs.rs]
features = ["std", "serde", "commands"]

[lib]
name = "radroots_protocol"

[features]
default = ["std", "serde"]
serde = ["dep:serde"]
std = ["serde?/std"]
commands = ["serde", "dep:radroots_domain", "dep:serde_json", "dep:sha2", "dep:zeroize"]
intent = ["dep:radroots_domain", "dep:sha2"]
nip01 = ["dep:radroots_identity", "dep:sha2", "dep:zeroize"]
chat = ["commands", "nip01"]

[dependencies]
radroots_identity = { workspace = true, default-features = false, optional = true }
radroots_domain = { workspace = true, default-features = false, features = ["serde"], optional = true }
serde_json = { workspace = true, default-features = false, features = ["alloc", "raw_value"], optional = true }
sha2 = { workspace = true, default-features = false, optional = true }
zeroize = { workspace = true, default-features = false, features = ["alloc"], optional = true }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
