[package]
name = "radroots_protocol"
publish = false
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Versioned wire contracts for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_protocol"
readme = "README.md"

[lib]
name = "radroots_protocol"

[features]
default = ["std", "serde"]
serde = ["dep:serde"]
std = ["serde?/std"]

[dependencies]
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
