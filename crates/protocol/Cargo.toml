[package]
name = "radroots_protocol"
publish = false
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Versioned wire contracts for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_protocol"
readme = "README.md"
keywords = ["radroots", "protocol", "local-food", "wire-format"]
categories = ["encoding", "no-std"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
features = ["std", "serde"]

[lib]
name = "radroots_protocol"

[features]
default = ["std", "serde"]
serde = ["dep:serde"]
std = ["serde?/std"]

[dependencies]
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
