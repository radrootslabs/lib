[package]
name = "radroots-core"
publish = false
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core value model for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots-core"
readme = "README.md"

[lib]
name = "radroots_core"

[features]
default = ["std", "serde"]
dto-bindgen = ["std", "serde", "dep:dto_bindgen"]
std = []
serde = ["dep:serde", "rust_decimal/serde"]

[dependencies]
dto_bindgen = { workspace = true, optional = true }
rust_decimal = { workspace = true, default-features = false }
rust_decimal_macros = { workspace = true }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
serde_json = { workspace = true }
rust_decimal = { workspace = true }

[lints]
workspace = true
