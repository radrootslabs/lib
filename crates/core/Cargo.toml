[package]
name = "radroots_core"
publish = ["crates-io"]
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core value model for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_core"
readme = "README.md"
keywords = ["radroots", "local-food", "domain-model"]
categories = ["data-structures", "no-std"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
features = ["std", "serde"]

[lib]
name = "radroots_core"

[features]
default = ["std", "serde"]
std = []
serde = ["dep:serde", "rust_decimal/serde"]

[dependencies]
rust_decimal = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
dto_bindgen = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }

[lints]
workspace = true
