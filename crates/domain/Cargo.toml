[package]
name = "radroots_domain"
publish = ["crates-io"]
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Exact values and deterministic shared Radroots domain invariants"
readme = "README.md"
include = ["src/**", "tests/**", "data/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
default = ["std", "serde"]
std = ["radroots_identity/std"]
serde = ["dep:serde", "radroots_identity/serde"]

[dependencies]
radroots_identity = { workspace = true, default-features = false }
serde = { workspace = true, optional = true }
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
