[package]
name = "radroots_indexeddb_browser_fixture"
version = "0.0.0"
publish = false
edition = "2024"
rust-version = "1.99.0"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
radroots_storage_indexeddb = { path = "../.." }
radroots_storage = { path = "../../../storage" }
radroots_secrets = { path = "../../../secrets", features = ["memory"] }
futures = "=0.3.32"
hex = "=0.4.3"
js-sys = "=0.3.91"
wasm-bindgen = "=0.2.114"
wasm-bindgen-futures = "=0.4.64"
