[package]
name = "radroots_transport_nostr_browser"
publish = false
version = "0.1.0-alpha"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Bounded browser sockets for the shared Radroots Nostr session"
readme = "README.md"

[dependencies]
radroots_transport = { workspace = true, features = ["std"] }
radroots_transport_nostr = { workspace = true }
futures = { workspace = true }
url = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
async-utility = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-time = { workspace = true }
web-sys = { workspace = true, features = ["BinaryType", "CloseEvent", "Event", "EventTarget", "MessageEvent", "WebSocket"] }

[lints]
workspace = true
