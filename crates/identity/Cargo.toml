[package]
name = "radroots-identity"
publish = false
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Public identity and account value types for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots-identity"
readme = "README.md"

[lib]
name = "radroots_identity"

[features]
default = ["std", "serde", "json-file"]
std = [
  "dep:radroots_protected_store",
  "dep:radroots_runtime_paths",
  "dep:radroots_secret_vault",
  "dep:serde_json",
  "dep:tracing",
  "thiserror/std",
]
serde = ["dep:serde"]
json-file = ["std", "serde", "dep:radroots_runtime"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
radroots_runtime = { workspace = true, optional = true }
radroots_protected_store = { workspace = true, optional = true, features = [
  "std",
] }
radroots_runtime_paths = { workspace = true, optional = true }
radroots_secret_vault = { workspace = true, optional = true, features = [
  "std",
] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { version = "2", default-features = false }
tracing = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
tempfile = { workspace = true }

[lints]
workspace = true
