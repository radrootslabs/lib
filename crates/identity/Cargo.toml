[package]
name = "radroots_identity"
publish = ["crates-io"]
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Public identity and account value types for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_identity"
readme = "README.md"
keywords = ["radroots", "identity", "nostr", "secp256k1"]
categories = ["cryptography", "data-structures", "no-std"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
features = ["std", "serde"]

[lib]
name = "radroots_identity"

[features]
default = ["std", "serde"]
std = ["thiserror/std"]
serde = ["dep:serde"]

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
serde = { workspace = true, optional = true }
thiserror = { version = "2", default-features = false }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
