[package]
name = "radroots_event"
publish = false
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Domain event model for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_event"
readme = "README.md"

[lib]
name = "radroots_event"

[features]
default = ["std", "serde"]
knowledge = []
std = [
  "radroots_blossom/std",
  "radroots_core/std",
  "radroots_identity/std",
  "radroots_protocol/std",
  "url_nostd/std",
]
serde = [
  "dep:serde",
  "radroots_core/serde",
  "radroots_identity/serde",
  "radroots_protocol/serde",
]

[dependencies]
radroots_blossom = { workspace = true, default-features = false }
radroots_core = { workspace = true, default-features = false }
radroots_identity = { workspace = true, default-features = false }
radroots_protocol = { workspace = true, default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
jiff-tzdb = { workspace = true }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
] }
sha2 = { workspace = true, default-features = false }
unicode-general-category = { workspace = true }
url_nostd = { workspace = true }

[dev-dependencies]
dto_bindgen = { workspace = true }
radroots_core = { workspace = true, default-features = false, features = [
  "serde",
  "std",
] }
radroots_identity = { workspace = true, default-features = false, features = [
  "serde",
  "std",
] }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
] }

[lints]
workspace = true
