[package]
name = "radroots_event_store"
publish = false
version = "1.0.0-alpha.1"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Canonical event store for Radroots"
repository.workspace = true
homepage.workspace = true
readme = "README"

[features]
default = ["sqlite", "runtime-tokio"]
sqlite = ["dep:getrandom", "dep:sqlx", "sqlx/sqlite-bundled"]
runtime-tokio = ["sqlx/runtime-tokio"]

[dependencies]
radroots_event = { workspace = true, default-features = false, features = [
  "std",
  "serde",
] }
radroots_event_codec = { workspace = true, default-features = false, features = [
  "nostr",
  "serde_json",
  "std",
] }
radroots_transport = { workspace = true, default-features = false }
hex = { workspace = true }
getrandom = { workspace = true, optional = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
sqlx = { workspace = true, optional = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
nostr = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
