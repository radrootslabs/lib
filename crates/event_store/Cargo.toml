[package]
name = "radroots_event_store"
publish = false
version = "0.1.0-alpha"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Publish-frozen event-store compatibility implementation"
repository.workspace = true
homepage.workspace = true
readme = "README"

[package.metadata.radroots.compatibility]
status = "publish_frozen"
replacement = "radroots_storage + radroots_storage_sqlite"
deviation = "RCRV1-DEV-009"
removal_step = 313
new_consumers_forbidden = true

[features]
default = ["sqlite", "runtime-tokio"]
sqlite = ["dep:getrandom", "dep:sqlx", "sqlx/sqlite-bundled"]
runtime-tokio = ["sqlx/runtime-tokio"]

[dependencies]
radroots_blossom = { workspace = true, default-features = false, features = [
  "std",
] }
radroots_event = { workspace = true, default-features = false, features = [
  "std",
  "serde",
] }
radroots_event_codec = { workspace = true, default-features = false, features = [
  "json",
  "std",
] }
radroots_identity = { workspace = true, default-features = false, features = [
  "serde",
  "std",
] }
radroots_transport = { workspace = true, default-features = false }
hex = { workspace = true }
getrandom = { workspace = true, optional = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
sqlx = { workspace = true, optional = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
nostr = { workspace = true, features = ["std"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
