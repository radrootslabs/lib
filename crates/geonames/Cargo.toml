[package]
name = "radroots_geonames"
description = "Deterministic GeoNames asset and locality lookup provider for Radroots"
version = "0.1.0-alpha"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
publish = ["crates-io"]
documentation = "https://docs.rs/radroots_geonames"
keywords = ["radroots", "geonames", "geocoding", "locality"]
categories = ["database"]
include = [
  "src/**",
  "tests/**",
  "!tests/package_boundary.rs",
  "examples/**",
  "Cargo.toml",
  "README.md",
  "LICENSE-APACHE",
  "LICENSE-MIT",
]

[package.metadata.docs.rs]
features = []

[lib]
name = "radroots_geonames"
path = "src/lib.rs"

[dependencies]
fs2 = { workspace = true }
rusqlite = { workspace = true, features = ["bundled"] }
sha2 = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }

[lints]
workspace = true
