[package]
name = "radroots_authority"
publish = false
version = "0.1.0-alpha"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Authority model for Radroots"
repository.workspace = true
homepage.workspace = true

[features]
default = ["std"]
std = ["radroots_event/std", "radroots_identity/std"]

[dependencies]
radroots_event = { workspace = true, default-features = false }
radroots_identity = { workspace = true, default-features = false }

[dev-dependencies]
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
