[package]
name = "radroots_runtime_store"
publish = false
version = "0.1.0-alpha"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Publish-frozen runtime-store compatibility implementation"
repository.workspace = true
homepage.workspace = true
readme = "README"

[package.metadata.radroots.compatibility]
status = "publish_frozen"
replacement = "radroots_storage + radroots_storage_sqlite or host-private state"
deviation = "RCRV1-DEV-009"
removal_step = 313
new_consumers_forbidden = true

[lib]
crate-type = ["rlib"]

[features]
default = []
native = ["radroots_sql_core/native"]

[dependencies]
radroots_sql_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
radroots_sql_core = { workspace = true, features = ["native"] }
