[package]
name = "radroots_storage"
description = "Backend-neutral persistence abstractions for Radroots"
version = "0.1.0-alpha"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
publish = ["crates-io"]
documentation = "https://docs.rs/radroots_storage"
keywords = ["radroots", "storage", "persistence", "events"]
categories = ["database", "data-structures", "no-std"]
include = ["src/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
features = ["memory", "serde"]

[lib]
name = "radroots_storage"

[features]
default = ["memory", "serde"]
memory = []
serde = [
  "dep:serde",
  "radroots_event/serde",
  "radroots_protocol/serde",
  "radroots_trade/serde",
  "radroots_transport/serde",
]

[dependencies]
radroots_event = { workspace = true, default-features = false }
radroots_protocol = { workspace = true, default-features = false }
radroots_trade = { workspace = true, default-features = false }
radroots_transport = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
futures-executor = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
