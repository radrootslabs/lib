[package]
name = "radroots_execution"
publish = ["crates-io"]
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Typed Radroots command execution and recovery boundaries"
readme = "README.md"
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[features]
default = []
session = ["dep:futures"]
signer_session = ["session", "dep:radroots_signing"]
client_session = ["signer_session"]
workspace_session = ["client_session", "receipts", "radroots_protocol/commands", "radroots_protocol/listing", "radroots_signing/artifacts", "dep:radroots_transport"]
receipts = ["dep:radroots_storage", "radroots_storage/command_journal"]

[dependencies]
radroots_domain = { workspace = true, default-features = false }
radroots_protocol = { workspace = true, default-features = false, features = ["intent"] }
futures = { workspace = true, optional = true }
radroots_signing = { workspace = true, default-features = false, optional = true }
radroots_storage = { workspace = true, default-features = false, optional = true }
radroots_transport = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
radroots_transport = { workspace = true }
futures = { workspace = true }
radroots_event = { workspace = true, default-features = false }
radroots_event_codec = { workspace = true, default-features = false }
radroots_identity = { workspace = true, default-features = false }

[lints]
workspace = true
