[package]
name = "radroots_signing"
description = "Signing abstractions and authorization policy for Radroots"
version = "0.1.0-alpha"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
documentation = "https://docs.rs/radroots_signing"
publish = ["crates-io"]
keywords = ["radroots", "signing", "nostr", "authorization"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "!tests/package_boundary.rs", "examples/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
features = ["std", "serde"]

[lib]
name = "radroots_signing"

[features]
default = ["std", "serde"]
std = [
  "radroots_event/std",
  "radroots_event_codec/std",
  "radroots_identity/std",
  "radroots_protocol/std",
]
serde = [
  "dep:serde",
  "radroots_event/serde",
  "radroots_event_codec/json",
  "radroots_identity/serde",
  "radroots_protocol/serde",
]

[dependencies]
radroots_event = { workspace = true, default-features = false }
radroots_event_codec = { workspace = true, default-features = false }
radroots_identity = { workspace = true, default-features = false }
radroots_protocol = { workspace = true, default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
sha2 = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = [
  "alloc",
  "derive",
], optional = true }

[dev-dependencies]
serde_json = { workspace = true, features = ["std"] }
nostr = { workspace = true, features = ["std"] }

[lints]
workspace = true
