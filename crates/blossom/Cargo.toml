[package]
name = "radroots_blossom"
publish = ["crates-io"]
version = "1.0.0-alpha.1"
edition.workspace = true
authors = ["Tyson Lupul <tyson@radroots.org>"]
rust-version.workspace = true
license.workspace = true
description = "Portable Blossom protocol primitives for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_blossom"
readme = "README"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_json"]
std = ["serde?/std", "sha2/std", "url_nostd/std"]
raster-decode = [
  "std",
  "dep:image",
  "dep:libwebp",
  "dep:zune-core",
  "dep:zune-jpeg",
]

[dependencies]
image = { workspace = true, optional = true }
libwebp = { workspace = true, optional = true }
mediatype = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, default-features = false, features = [
  "alloc",
], optional = true }
sha2 = { workspace = true }
unicode-general-category = { workspace = true }
url_nostd = { workspace = true }
zune-core = { workspace = true, optional = true }
zune-jpeg = { workspace = true, optional = true }

[dev-dependencies]
hex = { workspace = true }
image = { workspace = true, features = ["webp"] }
serde_json = { workspace = true, features = ["std"] }
tempfile = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
