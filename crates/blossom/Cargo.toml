[package]
name = "radroots-blossom"
publish = false
version = "0.1.0"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Portable Blossom protocol primitives for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots-blossom"
readme = "README.md"

[lib]
name = "radroots_blossom"

[features]
default = ["serde"]
serde = ["dep:serde"]
std = ["serde?/std", "sha2/std", "url_nostd/std"]

[dependencies]
mediatype = { workspace = true }
serde = { workspace = true, optional = true }
sha2 = { workspace = true }
unicode-general-category = { workspace = true }
url_nostd = { workspace = true }

[dev-dependencies]
hex = { workspace = true }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true
