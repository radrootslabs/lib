[package]
name = "radroots_nostr_connect"
publish = ["crates-io"]
version = "0.1.0-alpha"
edition.workspace = true
authors.workspace = true
rust-version.workspace = true
license.workspace = true
description = "NIP-46 protocol model for Radroots"
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/radroots_nostr_connect"
readme = "README.md"
keywords = ["radroots", "nostr", "nip46", "signing"]
categories = ["cryptography", "network-programming"]
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]

[package.metadata.docs.rs]
features = ["serde"]

[lib]
name = "radroots_nostr_connect"

[features]
default = ["serde"]
serde = [
  "radroots_event/serde",
  "radroots_identity/serde",
  "radroots_protocol/serde",
]

[dependencies]
radroots_event = { workspace = true, default-features = false }
radroots_identity = { workspace = true, default-features = false }
radroots_nostr = { workspace = true, default-features = false }
radroots_protocol = { workspace = true, default-features = false }
nostr = { workspace = true, features = ["std", "nip44"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
