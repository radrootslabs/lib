spec_id = "radroots.crates.release.v1"
status = "final_architecture"
date = "2026-07-26"
package_count = 19
edition = "2024"
resolver = "3"
rust_version = "1.97.1"
license = "MIT OR Apache-2.0"
canonical_repositories = [
  "https://github.com/radrootslabs/lib",
  "https://github.com/radrootslabs/sdk",
]

[repositories.lib]
url = "https://github.com/radrootslabs/lib"
version = "0.1.0-alpha"
packages = [
  "radroots_core",
  "radroots_identity",
  "radroots_blossom",
  "radroots_protocol",
  "radroots_event",
  "radroots_event_codec",
  "radroots_trade",
  "radroots_signing",
  "radroots_transport",
  "radroots_nostr",
  "radroots_nostr_connect",
  "radroots_secrets",
  "radroots_storage",
  "radroots_storage_sqlite",
  "radroots_transport_nostr",
  "radroots_sync",
  "radroots_geonames",
]

[repositories.sdk]
url = "https://github.com/radrootslabs/sdk"
version = "0.1.0"
packages = ["radroots_sdk", "radroots"]

[repository_policy]
new_repository_forbidden = true
history_merge_forbidden = true
cross_repository_dependency = "registry_version"
synchronized_contract_copies_required = true

[release_policy]
sdk_facade_lockstep = true
lower_packages_independent_semver = true
public_codegen_features_forbidden = true
public_to_private_edges_forbidden = true
same_repository_path_and_version_required = true
package_realistic_validation_required = true
preview_packages_withheld = true

[quality_policy.coverage]
status = "temporary_heavy_development"
repository = "radrootslabs/lib"
scope = "all_required_workspace_crates"
minimum_percent = 90.0
metrics = ["executable_lines", "functions", "regions", "branches"]
require_measurable_branches = true
numeric_overrides_below_minimum_forbidden = true
reinstatement = "future_explicit_contract_and_spec_update"

[[package]]
name = "radroots_core"
crate = "radroots_core"
publish_order_hint = 1
tier = "foundation"
platform = "no_std + alloc; std feature"
responsibility = "Foundational value objects and deterministic invariants: decimal, currency, money, percentage, quantity, units, and pricing."
default_features = ["std", "serde"]
features = ["std", "serde"]
required_radroots_dependencies = []
optional_radroots_dependencies = []
modules = [
  "currency",
  "decimal",
  "money",
  "percent",
  "pricing",
  "quantity",
  "unit",
]
root_exports = [
  "Currency",
  "Decimal",
  "Money",
  "Percent",
  "Quantity",
  "QuantityPrice",
  "Unit",
  "Error",
]
forbidden = "Identifiers, identities, event kinds, networking, persistence, clocks, filesystem paths, process behavior, or application configuration."

