
# cargo-vet audits file

[criteria.build-execution-reviewed]
description = "The package's build-time process execution, generated inputs, environment handling, filesystem writes, and output paths were reviewed for hermetic, bounded operation."
implies = "safe-to-deploy"

[criteria.crypto-reviewed]
description = "The package's cryptographic algorithms, key material handling, randomness, constant-time expectations, and protocol composition were reviewed for the Radroots use case."
implies = "safe-to-deploy"

[criteria.network-parser-reviewed]
description = "The package's untrusted network parsing, canonicalization, size limits, recursion limits, and malformed-input behavior were reviewed for fail-closed operation."
implies = "safe-to-deploy"

[criteria.secret-handling-reviewed]
description = "The package's secret lifecycle, redaction, zeroization, persistence, keyring boundary, and error behavior were reviewed for the Radroots use case."
implies = "safe-to-deploy"

[[audits.anyhow]]
who = "Codex (automated single-owner source review)"
criteria = [
    "crypto-reviewed",
    "network-parser-reviewed",
    "secret-handling-reviewed",
]
delta = "1.0.102 -> 1.0.104"
notes = "Reviewed the complete published 1.0.102 -> 1.0.104 production and manifest delta, the downcast entry points and pointer wrappers, and the new context-chain mutation/drop regression. Context and nested-error pointer selection now takes raw field addresses without first creating a shared reference to the payload; TypeId admission and owning Error lifetime remain unchanged. This incorporates the RUSTSEC-2026-0190 fix. There is no new cryptographic algorithm, network decoder, formatting, logging or persistence behavior. The selected native public normal/build graphs are byte-identical and exclude this WASI generator dependency. The automated delta review inherits the existing 1.0.102 baseline exemption; it is not an independent full-crate audit, general redaction guarantee, Miri proof or WASI/browser runtime qualification."

[[audits.async-utility]]
who = "Codex (automated single-owner source review)"
criteria = "network-parser-reviewed"
delta = "0.3.2 -> 0.3.2@git:b323ae0c1c1424b78bf8bb8832b95e86771f1dee"
notes = "Reviewed the complete registry-to-Git Rust delta and manifest change. Native task handles delegate polling, completion and abort to Tokio; ordinary drop detaches while AbortOnDrop requests cancellation. Native timeout/runtime modules are unchanged and parse no network bytes. The WASM implementation uses local spawning, an Abortable future, oneshot output and an acquire/release completion guard; its source review does not qualify a browser runtime. Added tests cover cancellation before polling, repeated abort, retained completed output, detached ownership and non-Unpin/non-Send values. This automated delta review inherits the existing registry 0.3.2 exemption and makes no independent audit or universal task-termination claim."

[[audits.async-wsocket]]
