issue-prefix: "rr"
no-git-ops: true

create:
  require-description: true

validation:
  on-create: warn
  on-sync: none

dolt:
  auto-commit: on
  auto-push: false
  shared-server: true

backup:
  enabled: false

directory:
  labels:
    contract: area:contract
    conformance: area:conformance
    docs: area:docs
    nix: area:nix
    scripts: area:scripts

    crates/core: crate:core
    crates/event: crate:event
    crates/event_codec: crate:event_codec
    crates/event_index: crate:event_index
    crates/identity: crate:identity
    crates/log: crate:log
    crates/net: crate:net
    crates/nostr: crate:nostr
    crates/nostr_accounts: crate:nostr_accounts
    crates/nostrdb: crate:nostrdb
    crates/nostr_runtime: crate:nostr_runtime
    crates/runtime: crate:runtime
    crates/runtime_store: crate:runtime_store
    crates/sql_core: crate:sql_core
    crates/replica_schema: crate:replica_schema
    crates/replica_store: crate:replica_store
    crates/replica_sync: crate:replica_sync
    crates/trade: crate:trade
    crates/trade_sp1_guest: crate:trade_sp1_guest
    crates/trade_sp1_host: crate:trade_sp1_host
    crates/xtask: crate:xtask

external_projects:
  plat: ../../../..
