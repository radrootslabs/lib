[graph]
targets = [
  "aarch64-apple-darwin",
  "wasm32-unknown-unknown",
  "x86_64-pc-windows-gnu",
  "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
# `nostr` 0.44.7 depends on `url-fork` 3.0.1 and therefore `idna` 0.5.0.
# The only network-capable public adapter canonicalizes every relay URL with
# patched `url` >=2.5.4 before the value reaches upstream Nostr code. This
# exact exception is contract-bound and must be removed with the Nostr 0.45
# stable upgrade.
ignore = [
  "RUSTSEC-2024-0384", # `instant` is an unmaintained, non-vulnerability Nostr 0.44 dependency.
  "RUSTSEC-2024-0421",
]

[licenses]
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "allow"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
allow-workspace = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
