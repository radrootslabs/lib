schema_version = 1
mode = "explicit_forward_only_one_shot"
source_kinds = ["event_store", "outbox", "private", "studio"]
source_path = "absolute_existing_utf8_regular_file_no_symlink"
source_cardinality = "one_to_four_unique_kinds_and_paths"
owned_file_alias = "reject_path_canonical_or_file_identity"
authority = "open_writable_target_backend"
capture = "sqlite_vacuum_into"
staging = ".radroots-legacy-import-{import_id_hex}.staging"
finalized = "radroots-legacy-import-{import_id_hex}"
member_mode = "0600"
manifest = "manifest.v1_exact_identity_target_generation_timestamp_source_provenance_inventory_lengths_sha256"
verification = [
  "sqlite_quick_check",
  "foreign_key_check",
  "exact_length",
  "sha256",
]
finalization = "same_root_atomic_directory_rename"
mutation_before_finalized_backup = false
collision = "reject"
hidden_entropy_or_clock = false
