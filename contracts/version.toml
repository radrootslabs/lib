[contract]
version = "1.0.0-alpha.1"
stability = "draft"

[semver]
major_on = [
  "remove_exported_type",
  "remove_exported_field",
  "remove_exported_function",
  "remove_exported_module",
  "remove_exported_constant",
  "remove_exported_trait_impl",
  "remove_public_cargo_feature",
  "add_exported_field",
  "change_exported_field_type",
  "change_exported_function_signature",
  "change_exported_enum_variant",
  "change_exported_constant_value",
  "change_exported_algorithm_behavior",
  "rename_internal_replica_crate_family",
]
minor_on = [
  "add_exported_type",
  "add_exported_function",
  "add_exported_constant",
  "add_public_foundation_crate",
  "add_optional_field",
  "add_enum_variant",
  "add_conformance_vector",
  "add_replica_transport_adapter",
  "add_transport_foundation_crate",
]
patch_on = [
  "fix_docs",
  "fix_non_behavioral_contract_metadata",
  "fix_packaging_metadata",
]

[release_integrity]
requires_conformance_pass = true
requires_contract_manifest_diff = true
requires_release_notes = true
