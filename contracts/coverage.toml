[gate]
fail_under_exec_lines = 90.0
fail_under_functions = 90.0
fail_under_regions = 90.0
fail_under_branches = 90.0
require_branches = true

# Heavy-development baseline authorized on 2026-07-28: every required crate
# must hold at least 90% coverage across executable lines, functions, regions,
# and branches. The 100% policy is intentionally deferred and must be restored
# by an explicit future contract change after the refactor stabilizes.

[overrides.radroots_replica_schema]
require_branches = false
temporary = true
reason = "branch coverage is not applicable while the crate has no measured branch records"

[overrides.radroots]
require_branches = false
temporary = true
reason = "branch coverage is not applicable while the facade crate has no measured branch records"

[overrides.radroots_core_bindings]
require_branches = false
temporary = true
reason = "branch coverage is not applicable while the binding inventory has no measured branch records"

[overrides.radroots_event_bindings]
require_branches = false
temporary = true
reason = "branch coverage is not applicable while the binding inventory has no measured branch records"

[overrides.radroots_identity_bindings]
require_branches = false
temporary = true
reason = "branch coverage is not applicable while the binding inventory has no measured branch records"

[overrides.radroots_replica_schema_bindings]
require_branches = false
temporary = true
reason = "branch coverage is not applicable while the binding inventory has no measured branch records"

[overrides.radroots_sdk_ffi]
require_branches = false
temporary = true
reason = "branch coverage is not applicable while the UniFFI facade has no measured branch records"

[overrides.radroots_mobile_bindgen]
require_branches = false
temporary = true
reason = "branch coverage is not applicable while the coverage-only bindgen entry point has no measured branch records"

[overrides.radroots_test_fixtures]
require_branches = false
temporary = true
reason = "branch coverage is not applicable while the crate has no measured branch records"

