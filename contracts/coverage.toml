[gate]
fail_under_exec_lines = 90.0
fail_under_functions = 90.0
fail_under_regions = 90.0
fail_under_branches = 90.0
require_branches = true

# Heavy-development baseline authorized on 2026-07-28: every required crate
# must hold at least 90% coverage across executable lines, functions, regions,
# and branches. The 100% policy is intentionally deferred and must be restored
# by an explicit future contract change after the refactor stabilizes.

[overrides.radroots_replica_schema]
require_branches = false
temporary = true
reason = "branch coverage is not applicable while the crate has no measured branch records"

[overrides.radroots_test_fixtures]
require_branches = false
temporary = true
reason = "branch coverage is not applicable while the crate has no measured branch records"

[required]
crates = [
  "radroots_blossom",
  "radroots_core",
  "radroots_event",
  "radroots_event_codec",
  "radroots_geonames",
  "radroots_identity",
  "radroots_mesh",
  "radroots_mesh_agent_client",
  "radroots_mesh_agent_proto",
  "radroots_nostr",
  "radroots_nostr_connect",
  "radroots_nostrdb",
  "radroots_protocol",
  "radroots_secrets",
  "radroots_signing",
  "radroots_storage",
  "radroots_storage_sqlite",
  "radroots_sync",
  "radroots_transport_nostr",
  "radroots_transport_reticulum",
  "radroots_replica_store",
  "radroots_replica_schema",
  "radroots_replica_sync",
  "radroots_runtime_distribution",
  "radroots_runtime_manager",
  "radroots_runtime_paths",
  "radroots_sql_core",
  "radroots_test_fixtures",
  "radroots_trade",
  "radroots_transport",
  "xtask",
]
