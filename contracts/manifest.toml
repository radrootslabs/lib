[contract]
name = "radroots_core_contract"
version = "1.0.0-alpha.1"
source = "rust"

[surface]
model_crates = [
  "radroots_protocol_contract_v1",
  "radroots_blossom",
  "radroots_core",
  "radroots_event",
  "radroots_trade",
  "radroots_identity",
]
algorithm_crates = [
  "radroots_blossom",
  "radroots_event_codec",
  "radroots_nostr",
]

[surface.rust_crate_tiers]
advanced_substrate = [
  "radroots_blossom",
  "radroots_core",
  "radroots_event",
  "radroots_event_codec",
  "radroots_trade",
  "radroots_identity",
  "radroots_nostr",
  "radroots_nostr_connect",
  "radroots_nostr_signer",
  "radroots_nostr_accounts",
  "radroots_secret_vault",
  "radroots_protected_store",
  "radroots_runtime_paths",
]
published_support = [
  "radroots_log",
  "radroots_runtime",
  "radroots_runtime_distribution",
  "radroots_runtime_manager",
  "radroots_protocol_contract_v1",
  "radroots_geocoder",
  "radroots_event_index",
  "radroots_sql_core",
  "radroots_replica_schema",
  "radroots_replica_store",
  "radroots_replica_sync",
]
deferred_publication = [
  "radroots_authority",
  "radroots_event_store",
  "radroots_outbox",
  "radroots_transport_publish_protocol",
  "radroots_transport_nostr",
  "radroots_transport_reticulum",
  "radroots_transport",
  "radroots_mesh",
  "radroots_mesh_agent_client",
  "radroots_mesh_agent_proto",
  "radroots_nostrdb",
  "radroots_simplex_chat_proto",
  "radroots_simplex_smp_proto",
  "radroots_trade_sp1_guest",
  "radroots_trade_sp1_host",
]

[surface.internal_replica_crates]
schema = "radroots_replica_schema"
storage = "radroots_replica_store"
sync = "radroots_replica_sync"

[policy]
exclude_internal_workspace_crates = true
require_reproducible_exports = true
require_conformance_vectors = true

[policy.replica]
forbid_legacy_alias_identifiers = true
require_transport_agnostic_sync_contract = true
# Emit is required in default builds; ingest is required only under the
# explicit non-default legacy-ingest feature governed by contracts/replica.toml.
require_deterministic_emit_ingest = true
