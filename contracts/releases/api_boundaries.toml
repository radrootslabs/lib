[[exception]]
id = "RCRV1-API-006"
package = "radroots_nostr_connect"
source = "src/client.rs"
forbidden_path = "nostr"
items = [
  "client::RadrootsNostrConnectClientTarget",
  "client::RadrootsNostrConnectClientTarget::new",
  "client::RadrootsNostrConnectClientTransport",
  "client::build_request_event",
  "client::execute_request_with_transport",
  "client::parse_response_event",
]
observed_paths = [
  "nostr::Event",
  "nostr::Keys",
  "nostr::PublicKey",
  "nostr::RelayUrl",
]
adr = "docs/decisions/0001-public-api-leakage-migration-baseline.md"
removal_step = 313
rationale = "Hidden, publish-frozen client signatures remain only for CLI, Myc, and residual first-party cutovers in Steps 271, 288, and 293."

