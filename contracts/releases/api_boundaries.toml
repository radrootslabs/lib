[[exception]]
id = "RCRV1-API-003"
package = "radroots_nostr"
source = "src/client.rs"
forbidden_path = "nostr_sdk"
items = [
  "client::RadrootsNostrClient::from_inner",
  "client::RadrootsNostrClient::into_inner",
]
observed_paths = ["nostr_sdk::Client"]
adr = "docs/decisions/0001-public-api-leakage-migration-baseline.md"
removal_step = 124
rationale = "Legacy client ownership remains visible only until the Nostr package removes live relay-client dependencies."

[[exception]]
id = "RCRV1-API-004"
package = "radroots_nostr"
source = "src/error.rs"
forbidden_path = "nostr_sdk"
items = ["error::RadrootsNostrError"]
observed_paths = [
  "nostr_sdk::client::Error",
  "nostr_sdk::prelude::DatabaseError",
]
adr = "docs/decisions/0001-public-api-leakage-migration-baseline.md"
removal_step = 124
rationale = "Legacy SDK error variants remain exact-scoped until normalized adapter errors replace them."

