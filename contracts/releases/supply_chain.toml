schema_version = 1
spec_id = "radroots.crates.release.v1"
package_version = "0.1.0-alpha"

[tools]
cargo_deny = "0.19.8"
cargo_cyclonedx = "0.5.9"
cargo_vet = "0.10.2"

[sbom]
format = "json"
spec_version = "1.5"
target = "all"
all_features = true
source_date_epoch = 0

[[advisory_exception]]
id = "RUSTSEC-2024-0384"
package = "instant"
affected_version = "0.1.13"
introduced_by = "nostr 0.44.7"
classification = "unmaintained"
mitigation = "No Radroots public API exposes instant; replace the dependency when upstream Nostr removes it."
remove_when = "nostr >=0.45.0 stable"

[[advisory_exception]]
id = "RUSTSEC-2024-0421"
package = "idna"
affected_version = "0.5.0"
introduced_by = "nostr 0.44.7 via url-fork 3.0.1"
classification = "vulnerability"
mitigation = "radroots_transport_nostr canonicalizes every relay URL with url >=2.5.4 before upstream Nostr receives it."
remove_when = "nostr >=0.45.0 stable"

[[advisory_exception]]
id = "CARGO-YANKED-SPIN-0.9.8"
package = "spin"
affected_version = "0.9.8"
introduced_by = "sqlx 0.9.0 via flume 0.12.0"
classification = "yanked"
mitigation = "The package has no RustSec vulnerability; the gate rejects every yanked name/version except this exact transitive dependency."
remove_when = "sqlx no longer resolves flume 0.12.0 with spin 0.9.8"

[[git_source]]
url = "https://github.com/rust-nostr/nostr.git"
revision = "5bba5163eb77107f82c4a8262cf29d7f33a73219"
packages = ["nostr", "nostr-relay-builder", "nostr-sdk"]
removal_when = "nostr 0.45 stable satisfies Studio compatibility tests"

