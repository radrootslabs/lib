[contract]
name = "radroots_core_contract"
version = "0.1.0-alpha.2"
source = "rust"

[public]
domains = [
  "profile",
  "farm",
  "listing",
  "trade",
  "trade_validation",
  "social",
  "knowledge",
]

[shared_types]
public = [
  "RadrootsNip01EventWireParts",
  "RadrootsEventDraft",
  "RadrootsSignedEvent",
  "RadrootsEventEnvelope",
  "RadrootsEventRef",
  "RadrootsEventPtr",
  "RadrootsListingAddress",
  "RadrootsProfile",
  "RadrootsFarm",
  "RadrootsListing",
  "RadrootsPost",
  "RadrootsComment",
  "RadrootsReaction",
  "RadrootsArticle",
  "RadrootsFileMetadata",
  "RadrootsCalendarDateEvent",
  "RadrootsCalendarTimeEvent",
  "RadrootsTradeId",
  "RadrootsTradeCandidateId",
  "RadrootsTradeMutationId",
  "RadrootsTradeMutationKindV1",
  "RadrootsTradeMutationEnvelopeV1",
  "RadrootsTradeMutationBodyV1",
  "RadrootsTradeCandidateTermsV1",
  "RadrootsTradeCandidateLineV1",
  "RadrootsTradeLineTombstoneV1",
  "RadrootsTradeEconomicsProfileV1",
  "RadrootsTradeEconomicAdjustmentV1",
  "RadrootsFulfillmentProfileV1",
  "RadrootsTradeCancellationProfileV1",
  "RadrootsTradePrivateTermsRefV1",
  "RadrootsSellerReservationAssertionV1",
  "RadrootsSellerReservationLineV1",
  "RadrootsTradeDecisionV1",
  "RadrootsTradeCanonicalMutationV1",
  "RadrootsWikiArticle",
  "RadrootsWikiRedirect",
  "RadrootsWikiMergeRequest",
  "RadrootsKnowledgeSource",
  "RadrootsKnowledgeClaim",
  "RadrootsKnowledgeRelation",
  "RadrootsKnowledgeReview",
  "RadrootsKnowledgeFieldReport",
  "RadrootsEvidenceBounty",
  "RadrootsKnowledgeChangeProposal",
  "RadrootsContributionAttestation",
  "RadrootsKnowledgeContractManifest",
  "RadrootsDecodedEvent",
]

[errors]
classes = [
  "encode_error",
  "parse_error",
  "validation_error",
  "address_error",
  "decode_error",
]

[implementation_provenance]
model_crates = [
  "radroots_protocol_contract_v1",
  "radroots_core",
  "radroots_event",
  "radroots_trade",
  "radroots_identity",
]
algorithm_crates = ["radroots_event_codec"]

[operations.profile_build_draft]
domain = "profile"
id = "profile.build_draft"
stability = "beta"
inputs = ["RadrootsProfile", "RadrootsProfileType?"]
outputs = ["RadrootsNip01EventWireParts"]
error_class = "encode_error"
deterministic = true
signing = "native"
transport = "native"

[operations.profile_build_draft.implementation]
rust_modules = ["crates/event_codec/src/profile/encode.rs"]
rust_types = ["radroots_event::profile::RadrootsProfile"]

[operations.profile_build_draft.conformance]
vector = "contracts/conformance/vectors/profile/build_draft.v1.json"

[operations.farm_build_draft]
domain = "farm"
id = "farm.build_draft"
stability = "beta"
inputs = ["RadrootsFarm"]
outputs = ["RadrootsNip01EventWireParts"]
error_class = "encode_error"
deterministic = true
signing = "native"
transport = "native"

[operations.farm_build_draft.implementation]
rust_modules = ["crates/event_codec/src/farm/encode.rs"]
rust_types = ["radroots_event::farm::RadrootsFarm"]

[operations.farm_build_draft.conformance]
vector = "contracts/conformance/vectors/farm/build_draft.v1.json"

