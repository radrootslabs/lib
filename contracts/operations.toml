[operations.blossom_parse_hash_path]
domain = "blossom"
id = "blossom.parse_hash_path"
stability = "beta"
inputs = ["String"]
outputs = ["RadrootsBlossomHashPath"]
error_class = "validation_error"
deterministic = true
signing = "none"
transport = "none"

[operations.blossom_parse_hash_path.implementation]
rust_modules = ["crates/blossom/src/hash.rs"]
rust_types = [
  "radroots_blossom::RadrootsBlossomFileExtension",
  "radroots_blossom::RadrootsBlossomHashPath",
  "radroots_blossom::RadrootsBlossomSha256",
]

[operations.blossom_parse_hash_path.conformance]
vector = "contracts/conformance/vectors/blossom/hash_path_and_descriptor.v1.json"

