[package]
name = "radroots_sdk_xtask"
description = "Workspace automation for Radroots SDK crates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[[bin]]
name = "radroots_sdk_xtask"
path = "src/main.rs"

[dependencies]
dto_bindgen_backend_ts = { workspace = true }
dto_bindgen_core = { workspace = true }
radroots_core_bindings = { path = "../../crates/core_bindings", version = "=0.1.0-alpha" }
radroots_event_bindings = { path = "../../crates/event_bindings", version = "=0.1.0-alpha" }
radroots_event_index = { workspace = true, features = ["dto-bindgen"] }
radroots_identity = { workspace = true }
radroots_identity_bindings = { path = "../../crates/identity_bindings", version = "=0.1.0-alpha" }
radroots_protocol = { workspace = true }
radroots_replica_schema_bindings = { path = "../../crates/replica_schema_bindings", version = "=0.1.0-alpha" }
flate2 = "1"
serde_json = "1"
serde = { workspace = true, features = ["derive"] }
semver = "1"
sha2 = { workspace = true }
syn = { version = "2", features = ["full", "visit"] }
tar = "0.4"
tempfile = { workspace = true }
toml = "0.8"
