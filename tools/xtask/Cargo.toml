[package]
name = "xtask"
version = "0.1.0-alpha"
edition.workspace = true
rust-version.workspace = true
description = "Workspace task runner for Radroots Rust crates"
readme = "README"
license.workspace = true
publish = false
build = false
autolib = false
autobins = false
autotests = false
autoexamples = false
autobenches = false
authors = ["Tyson Lupul <tyson@radroots.org>"]

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
dto_bindgen_core = { workspace = true }
fs2 = { workspace = true }
hex = { workspace = true }
jsonschema = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
radroots_event_codec = { workspace = true, features = [
  "contract-manifest",
], default-features = false }
radroots_protocol_contract_v1 = { workspace = true, features = ["std"] }
semver = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
syn = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
