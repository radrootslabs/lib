[package]
name = "xtask"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
description = "Workspace task runner for Radroots Rust crates"
readme = "README"
license.workspace = true
publish = false
authors = ["Tyson Lupul <tyson@radroots.org>"]

[dependencies]
radroots_event_codec = { workspace = true, features = [
  "contract-manifest",
], default-features = false }
radroots_protocol_contract_v1 = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }
