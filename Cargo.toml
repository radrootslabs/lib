[workspace]
members = [
  "crates/core",
  "crates/event",
  "crates/event_store",
  "crates/event_codec",
  "crates/event_index",
  "crates/authority",
  "crates/blossom",
  "crates/geocoder",
  "crates/identity",
  "crates/runtime_store",
  "crates/log",
  "crates/net",
  "crates/nostr",
  "crates/nostr_accounts",
  "crates/nostr_connect",
  "crates/nostr_signer",
  "crates/nostrdb",
  "crates/nostr_runtime",
  "crates/outbox",
  "crates/protocol_contract_v1",
  "crates/transport_publish_protocol",
  "crates/transport_nostr",
  "crates/transport_reticulum",
  "crates/runtime",
  "crates/secret_vault",
  "crates/simplex_app_store",
  "crates/simplex_agent_proto",
  "crates/simplex_agent_runtime",
  "crates/simplex_agent_store",
  "crates/simplex_chat_proto",
  "crates/simplex_interop_tests",
  "crates/simplex_smp_crypto",
  "crates/simplex_smp_proto",
  "crates/simplex_smp_transport",
  "crates/sql_core",
  "crates/test_fixtures",
  "crates/replica_schema",
  "crates/replica_sync",
  "crates/replica_store",
  "crates/runtime_paths",
  "crates/runtime_distribution",
  "crates/runtime_manager",
  "crates/trade_sp1_guest",
  "crates/trade_sp1_host",
  "crates/trade",
  "crates/transport",
  "crates/mesh",
  "crates/mesh_agent_client",
  "crates/mesh_agent_proto",
  "crates/protected_store",
  "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "1.0.0-alpha.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/radrootslabs/lib"
homepage = "https://radroots.org"
readme = "README"
authors = ["Tyson Lupul <tyson@radroots.org>"]

[workspace.metadata.radroots.public-package]
version = "0.1.0"
authors = ["Tyson Lupul <tyson@radroots.org>"]
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
dto_bindgen = { version = "0.1.0" }
dto_bindgen_core = { version = "0.1.0" }
radroots_core = { path = "crates/core", version = "=1.0.0-alpha.1", default-features = false }
