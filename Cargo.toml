[workspace]
members = [
  "crates/core",
  "crates/event",
  "crates/event_codec",
  "crates/blossom",
  "crates/identity",
  "crates/nostr",
  "crates/nostr_connect",
  "crates/protocol",
  "crates/signing",
  "crates/secrets",
  "crates/storage",
  "crates/storage_sqlite",
  "crates/sync",
  "crates/geonames",
  "crates/nostrdb",
  "crates/transport_nostr",
  "crates/transport_reticulum",
  "crates/simplex_app_store",
  "crates/simplex_agent_proto",
  "crates/simplex_chat_proto",
  "crates/simplex_smp_crypto",
  "crates/simplex_smp_proto",
  "crates/simplex_smp_transport",
  "crates/sql_core",
  "crates/test_fixtures",
  "crates/replica_schema",
  "crates/replica_sync",
  "crates/replica_store",
  "crates/runtime_paths",
  "crates/runtime_distribution",
  "crates/runtime_manager",
  "crates/trade",
  "crates/transport",
  "crates/mesh",
  "crates/mesh_agent_client",
  "crates/mesh_agent_proto",
  "crates/mobile_bindgen",
  "crates/mobile_core",
  "crates/mobile_ffi",
  "crates/mobile_wasm",
  "crates/core_bindings",
  "crates/event_bindings",
  "crates/event_codec_wasm",
  "crates/identity_bindings",
  "crates/radroots",
  "crates/replica_schema_bindings",
  "crates/replica_store_wasm",
  "crates/replica_sync_wasm",
  "crates/sdk",
  "crates/sdk_ffi",
  "crates/sdk_sql_wasm_runtime",
  "crates/trade_bindings",
  "tools/xtask",
]
default-members = [
  "crates/core",
  "crates/identity",
  "crates/blossom",
  "crates/protocol",
  "crates/event",
  "crates/event_codec",
  "crates/trade",
  "crates/signing",
  "crates/transport",
  "crates/nostr",
  "crates/nostr_connect",
  "crates/secrets",
  "crates/storage",
  "crates/storage_sqlite",
  "crates/transport_nostr",
  "crates/sync",
  "crates/geonames",
  "crates/sdk",
  "crates/radroots",
  "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/radrootslabs/lib"
homepage = "https://radroots.org"
readme = "README.md"
authors = ["Tyson Lupul <tyson@radroots.org>"]

[workspace.metadata.radroots.public-package]
version = "0.1.0-alpha"
authors = ["Tyson Lupul <tyson@radroots.org>"]
readme = "README.md"

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage_nightly)'] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
dto_bindgen = { version = "0.1.0" }
dto_bindgen_backend_ts = { version = "0.1.0" }
dto_bindgen_core = { version = "0.1.0" }
radroots = { path = "crates/radroots", version = "=0.1.0-alpha" }
radroots_core_bindings = { path = "crates/core_bindings", version = "=0.1.0-alpha" }
radroots_core = { package = "radroots_core", path = "crates/core", version = "=0.1.0-alpha", default-features = false }
radroots_event = { package = "radroots_event", path = "crates/event", version = "=0.1.0-alpha", default-features = false }
