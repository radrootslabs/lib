[package]
name = "radroots_parser_fuzz"
publish = false
version = "0.1.0-alpha"
edition = "2024"
rust-version = "1.97.1"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
radroots_blossom = { path = "../../crates/blossom", default-features = false, features = ["std"] }
radroots_event_codec = { path = "../../crates/event_codec", default-features = false, features = ["manifests", "std"] }
radroots_nostr_connect = { path = "../../crates/nostr_connect" }
radroots_protocol = { path = "../../crates/protocol", default-features = false, features = ["std"] }
radroots_secrets = { path = "../../crates/secrets", default-features = false }
radroots_storage = { path = "../../crates/storage", default-features = false, features = ["serde"] }
serde_json = "1"

[[bin]]
name = "event_codec_decode_verify"
path = "fuzz_targets/event_codec_decode_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_identifiers"
path = "fuzz_targets/protocol_identifiers.rs"
test = false
doc = false
bench = false

[[bin]]
name = "nip46_messages_and_uris"
path = "fuzz_targets/nip46_messages_and_uris.rs"
test = false
doc = false
bench = false

[[bin]]
name = "blossom_url"
path = "fuzz_targets/blossom_url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "knowledge_manifest"
path = "fuzz_targets/knowledge_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "backup_manifest"
path = "fuzz_targets/backup_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "restore_plan"
path = "fuzz_targets/restore_plan.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secrets_envelope_and_artifact"
path = "fuzz_targets/secrets_envelope_and_artifact.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
